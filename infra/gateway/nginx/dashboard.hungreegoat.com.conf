# dashboard.hungreegoat.com — PRIVATE operator dashboard (HUNGREE Goat Control). Login is enforced by the app;
# this vhost adds TLS, login rate-limiting and (optionally) Authentik forward-auth in front.
limit_req_zone $binary_remote_addr zone=hglogin:10m rate=5r/m;
server {
    listen 80; server_name dashboard.hungreegoat.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2; server_name dashboard.hungreegoat.com;
    ssl_certificate /etc/letsencrypt/live/dashboard.hungreegoat.com/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/dashboard.hungreegoat.com/privkey.pem;
    add_header X-Frame-Options DENY always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 2g;                      # track uploads
    # --- optional second factor: Authentik forward-auth (uncomment after creating a proxy provider for this host)
    # include /etc/nginx/snippets/authentik-forward-auth.conf;
    location = /api/login { limit_req zone=hglogin burst=5 nodelay; proxy_pass http://127.0.0.1:18090; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; }
    location /v1/ { return 404; }                 # the public API lives on api.hungreegoat.com, not here
    location ~ ^/api/stations/[a-z]+/listen\.mp3$ { proxy_pass http://127.0.0.1:18090; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 1h; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location / {
        proxy_pass http://127.0.0.1:18090; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600; proxy_request_buffering off;
    }
}
