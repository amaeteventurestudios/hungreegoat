# control.hungreegoat.com — PRIVATE operator dashboard (HUNGREE Goat Control).
# Login is enforced by the app itself; this vhost adds TLS and login rate-limiting.
# HTTP-only on purpose: see the matching note in api.hungreegoat.com.conf — certbot adds
# the SSL server block and redirect itself on first run (install-hetzner.sh).
limit_req_zone $binary_remote_addr zone=hglogin:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name control.hungreegoat.com;

    server_tokens off;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 2g;

    location = /api/login {
        limit_req zone=hglogin burst=5 nodelay;
        proxy_pass http://127.0.0.1:18090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v1/ { return 404; }

    location ~ ^/api/stations/[a-z]+/dj/ws$ {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 6h;
        proxy_buffering off;
    }

    location ~ ^/api/stations/[a-z]+/listen\.mp3$ {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600;
        proxy_request_buffering off;
    }
}
