# api.hungreegoat.com — PUBLIC read-only HUNGREE Goat station API.
# Upstream is the SSH reverse tunnel from pi-node-01 (127.0.0.1:18090 -> pi:8090).
# Only /v1/* is forwarded; everything else is 404.
#
# HTTP-only on purpose: certbot's --nginx plugin (see install-hetzner.sh) adds the
# listen-443/ssl_certificate/redirect blocks itself on first run. Committing this file
# with those lines pre-filled would make nginx refuse to (re)start on a fresh gateway,
# since the certificate files certbot would otherwise create don't exist yet.
limit_req_zone $binary_remote_addr zone=hgapi:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.hungreegoat.com;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /v1/listen/ {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        limit_req zone=hgapi burst=40 nodelay;
        proxy_pass http://127.0.0.1:18090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / { return 404; }
}
