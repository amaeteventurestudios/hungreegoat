# api.hungreegoat.com — PUBLIC read-only station API. Only /v1/* is forwarded; everything else is 404.
# Upstream is the SSH reverse tunnel from pi-node-01 (127.0.0.1:18090 → pi:8090).
limit_req_zone $binary_remote_addr zone=hgapi:10m rate=20r/s;
proxy_cache_path /var/cache/nginx/hgapi levels=1 keys_zone=hgapi:5m max_size=50m inactive=60s;
server {
    listen 80; server_name api.hungreegoat.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2; server_name api.hungreegoat.com;
    ssl_certificate /etc/letsencrypt/live/api.hungreegoat.com/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/api.hungreegoat.com/privkey.pem;
    add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always;
    location /v1/listen/ {                       # audio stream: no buffering, long-lived
        proxy_pass http://127.0.0.1:18090; proxy_http_version 1.1; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; proxy_set_header Host $host;
    }
    location /v1/ {
        limit_req zone=hgapi burst=40 nodelay;
        proxy_pass http://127.0.0.1:18090; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr;
        proxy_cache hgapi; proxy_cache_valid 200 2s; proxy_cache_use_stale updating error timeout; add_header X-Cache $upstream_cache_status;
    }
    location / { return 404; }                    # nothing else from the Pi is reachable here
}
