# dj.hungreegoat.com — PRIVATE DJ Studio (same HUNGREE Goat Control backend, same operator
# session as control.hungreegoat.com — see apps/dj-studio/NOTICE.md and hgc/main.py's login
# route, which now scopes the session cookie to the whole *.hungreegoat.com family so signing
# in on control.* is enough; this vhost never runs a second login).
#
# HTTP-only on purpose: see the matching note in api.hungreegoat.com.conf — certbot adds
# the SSL server block and redirect itself on first run (install-hetzner.sh).
server {
    listen 80;
    listen [::]:80;
    server_name dj.hungreegoat.com;

    server_tokens off;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    client_max_body_size 200m;

    # The DJ app's own relative fetches (manifest, mix save/audio, library audio) — same
    # backend, same routes it already uses at control.hungreegoat.com/api/dj/* and /v1/*.
    location /api/ {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else is the static DJ Studio app itself, mounted on the backend at /dj/ —
    # the trailing slash on proxy_pass's target rewrites the matched "/" prefix away so
    # dj.hungreegoat.com/whatever reaches 127.0.0.1:18090/dj/whatever.
    location / {
        proxy_pass http://127.0.0.1:18090/dj/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600;
    }
}
