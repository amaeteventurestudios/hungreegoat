name: ${COMPOSE_PROJECT_NAME:-hg-studio-dev}

services:
  studio-postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${STUDIO_DB_PASSWORD:?Run scripts/bootstrap.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  studio-migrate:
    user: "${STUDIO_UID:-1000}:${STUDIO_GID:-1000}"
    build:
      context: ../../apps/api
    image: hg-studio-api:local
    environment: &api-environment
      STUDIO_ENV: ${STUDIO_ENV:-development}
      STUDIO_LOG_LEVEL: ${STUDIO_LOG_LEVEL:-INFO}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-http://localhost:3210}
      STUDIO_SECRET_ROOT: /var/lib/studio/secrets/values
      STUDIO_SECRET_KEY_FILE: /var/lib/studio/secrets/fernet.key
      STUDIO_DATABASE_URL: postgresql+psycopg://studio:${STUDIO_DB_PASSWORD}@studio-postgres:5432/studio
      STUDIO_ASSET_ROOT: /var/lib/studio/assets
      STUDIO_WINDMILL_URL: http://studio-windmill:8000
      STUDIO_WINDMILL_WORKSPACE: studio
      STUDIO_WINDMILL_TOKEN_FILE: /run/studio-orchestration/windmill-token
      STUDIO_WINDMILL_SCRIPT_HASH_FILE: /run/studio-orchestration/script-hash
      STUDIO_WORKER_TOKEN_FILE: /run/studio-orchestration/worker-token
    command: [alembic, upgrade, head]
    volumes:
      - ${STUDIO_SECRET_DIRECTORY:?Run scripts/bootstrap-secrets.py first}:/var/lib/studio/secrets:ro
    depends_on:
      studio-postgres:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.5

  studio-api:
    image: hg-studio-api:local
    user: "${STUDIO_UID:-1000}:${STUDIO_GID:-1000}"
    build:
      context: ../../apps/api
    environment: *api-environment
    volumes:
      - ${STUDIO_ASSET_ROOT:?Run scripts/bootstrap.py first}:/var/lib/studio/assets
      - ${STUDIO_SECRET_DIRECTORY:?Run scripts/bootstrap-secrets.py first}:/var/lib/studio/secrets
      - ${STUDIO_ORCHESTRATION_DIRECTORY:?Run scripts/bootstrap-orchestration.py first}/worker-token:/run/studio-orchestration/worker-token:ro
      - ${STUDIO_ORCHESTRATION_DIRECTORY}/windmill-token:/run/studio-orchestration/windmill-token:ro
      - ${STUDIO_ORCHESTRATION_DIRECTORY}/script-hash:/run/studio-orchestration/script-hash:ro
    ports:
      - "127.0.0.1:${STUDIO_API_PORT:-8310}:8000"
    depends_on:
      studio-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    security_opt: [no-new-privileges:true]

  studio-web:
    image: hg-studio-web:local
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      STUDIO_API_URL: http://studio-api:8000
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-http://localhost:3210}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "127.0.0.1:${STUDIO_WEB_PORT:-3210}:3000"
    depends_on:
      studio-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    security_opt: [no-new-privileges:true]

  studio-windmill-postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: windmill
      POSTGRES_USER: windmill
      POSTGRES_PASSWORD: ${STUDIO_WINDMILL_DB_PASSWORD:?Run scripts/bootstrap-orchestration.py first}
    volumes:
      - windmill-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U windmill -d windmill"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

  studio-windmill:
    image: hg-studio-windmill:1.817.0-source
    environment:
      MODE: server
      PORT: 8000
      DATABASE_URL: postgresql://windmill:${STUDIO_WINDMILL_DB_PASSWORD}@studio-windmill-postgres:5432/windmill
      SUPERADMIN_SECRET: ${STUDIO_WINDMILL_BOOTSTRAP_TOKEN:-}
      BASE_URL: http://studio-windmill:8000
      NUM_WORKERS: 0
      JSON_FMT: 'true'
    depends_on:
      studio-windmill-postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  studio-worker:
    image: hg-studio-worker:local
    build:
      context: ../../apps/worker
    environment:
      MODE: worker
      DATABASE_URL: postgresql://windmill:${STUDIO_WINDMILL_DB_PASSWORD}@studio-windmill-postgres:5432/windmill
      BASE_INTERNAL_URL: http://studio-windmill:8000
      WORKER_GROUP: studio
      WORKER_TAGS: studio-ai,dependency
      FORCE_WORKER_TAGS: studio-ai,dependency
      NUM_WORKERS: 1
      JSON_FMT: 'true'
    volumes:
      - ${STUDIO_ORCHESTRATION_DIRECTORY}/worker-token:/run/studio-orchestration/worker-token:ro
      - ${STUDIO_ASSET_ROOT}:/var/lib/studio/assets
      - worker-cache:/tmp/windmill
    depends_on:
      studio-windmill-postgres:
        condition: service_healthy
      studio-windmill:
        condition: service_started
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  studio-dispatcher:
    image: hg-studio-api:local
    user: "${STUDIO_UID:-1000}:${STUDIO_GID:-1000}"
    command: [python, -m, studio_api.dispatcher]
    environment: *api-environment
    volumes:
      - ${STUDIO_ORCHESTRATION_DIRECTORY}/windmill-token:/run/studio-orchestration/windmill-token:ro
      - ${STUDIO_ORCHESTRATION_DIRECTORY}/script-hash:/run/studio-orchestration/script-hash:ro
    depends_on:
      studio-api:
        condition: service_healthy
      studio-windmill:
        condition: service_started
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

volumes:
  postgres-data:
  windmill-postgres-data:
  worker-cache:
